<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Warm cozy desk background -->
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Monitor Glow -->
    <filter id="screenGlow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cozy Background -->
  <rect width="800" height="600" fill="url(#labBg)" />

  <!-- Grid Blueprint lines on desk -->
  <g stroke="#3f3f46" stroke-width="1" opacity="0.25">
    <line x1="0" y1="150" x2="800" y2="150" stroke-dasharray="8,8" />
    <line x1="0" y1="300" x2="800" y2="300" stroke-dasharray="8,8" />
    <line x1="0" y1="450" x2="800" y2="450" stroke-dasharray="8,8" />
    <line x1="200" y1="0" x2="200" y2="600" stroke-dasharray="8,8" />
    <line x1="400" y1="0" x2="400" y2="600" stroke-dasharray="8,8" />
    <line x1="600" y1="0" x2="600" y2="600" stroke-dasharray="8,8" />
  </g>

  <!-- Big Glowing Computer Monitor -->
  <g transform="translate(160, 80)">
    <!-- Stand -->
    <rect x="210" y="360" width="60" height="70" fill="#3f3f46" rx="4" />
    <ellipse cx="240" cy="430" rx="90" ry="14" fill="#27272a" stroke="#52525b" stroke-width="2" />

    <!-- Monitor Outer Frame -->
    <rect x="0" y="0" width="480" height="360" rx="18" fill="#18181b" stroke="#52525b" stroke-width="3" />

    <!-- Screen Glass -->
    <rect x="16" y="16" width="448" height="328" rx="8" fill="#09090b" />

    <!-- Screen Cyan Glow -->
    <rect x="16" y="16" width="448" height="328" rx="8" fill="#0284c7" opacity="0.08" filter="url(#screenGlow)" />

    <!-- The Parent Container (Dotted red outline that is supposed to contain the div) -->
    <rect x="60" y="70" width="320" height="220" rx="10" fill="#1e1b4b" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,6" opacity="0.9" />

    <!-- The Rogue Blue <div> fleeing the screen! -->
    <g transform="translate(240, 40) rotate(-14)">
      <!-- Motion lines showing escape -->
      <line x1="-30" y1="40" x2="-60" y2="55" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-20" y1="60" x2="-55" y2="80" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="80" x2="-40" y2="105" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

      <!-- The wild runaway <div> -->
      <rect x="0" y="0" width="130" height="110" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
      <!-- Googly cartoon eyes on the runaway div -->
      <circle cx="45" cy="45" r="14" fill="#ffffff" />
      <circle cx="85" cy="45" r="14" fill="#ffffff" />
      <circle cx="50" cy="45" r="7" fill="#09090b" />
      <circle cx="90" cy="45" r="7" fill="#09090b" />
      <!-- Cheeky smile -->
      <path d="M 52 72 Q 65 85 78 72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <!-- Little runaway legs -->
      <line x1="35" y1="110" x2="20" y2="135" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="95" y1="110" x2="115" y2="132" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Confused Cartoon Stick Backend Engineer -->
    <g transform="translate(100, 180)">
      <!-- Head with sweat drops -->
      <circle cx="0" cy="0" r="24" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />
      <!-- Wide shock eyes -->
      <circle cx="-8" cy="-3" r="5" fill="#09090b" />
      <circle cx="8" cy="-3" r="5" fill="#09090b" />
      <!-- Mouth 'O' shape -->
      <circle cx="0" cy="12" r="5" fill="none" stroke="#09090b" stroke-width="2" />
      <!-- Blue sweat drop -->
      <path d="M 22 -14 C 22 -22 28 -28 28 -28 C 28 -28 34 -22 34 -14 C 34 -8 28 -4 28 -4 C 28 -4 22 -8 22 -14 Z" fill="#38bdf8" />
      <!-- Stick arms throwing hands up in air -->
      <line x1="0" y1="24" x2="0" y2="70" stroke="#ffffff" stroke-width="3" />
      <line x1="0" y1="36" x2="-28" y2="10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="36" x2="28" y2="10" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Question marks floating -->
    <text x="80" y="140" font-family="sans-serif" font-weight="900" font-size="28" fill="#fbbf24">?!</text>
    <text x="320" y="240" font-family="sans-serif" font-weight="900" font-size="20" fill="#f43f5e">404</text>

    <!-- Funny code snippet line on screen -->
    <g font-family="monospace" font-size="11" opacity="0.85">
      <text x="75" y="100" fill="#a78bfa">display: flex;</text>
      <text x="75" y="120" fill="#a78bfa">justify-content: center;</text>
      <text x="75" y="140" fill="#f43f5e">align-items: please;</text>
    </g>
  </g>

  <!-- Cute Coffee Mug on the Desk -->
  <g transform="translate(680, 440)">
    <rect x="0" y="0" width="46" height="58" rx="6" fill="#f43f5e" />
    <!-- Handle -->
    <path d="M 46 14 C 62 14 62 44 46 44" fill="none" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" />
    <!-- Heart on mug -->
    <path d="M 23 24 C 23 18 15 18 15 24 C 15 30 23 36 23 36 C 23 36 31 30 31 24 C 31 18 23 18 23 24 Z" fill="#ffffff" />
    <!-- Steam wisps -->
    <path d="M 16 -6 Q 22 -16 16 -26" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />
    <path d="M 30 -8 Q 36 -18 30 -28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4" stroke-linecap="round" />
  </g>
</svg>

