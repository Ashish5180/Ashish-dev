<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Dark Pop Art Cityscape Gradient -->
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Halftone CMYK Pattern -->
    <pattern id="halftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#e11d48" opacity="0.4" />
      <circle cx="16" cy="16" r="2.5" fill="#06b6d4" opacity="0.4" />
      <circle cx="0" cy="16" r="2" fill="#fbbf24" opacity="0.3" />
    </pattern>

    <!-- Chromatic Misregistration Filter -->
    <filter id="comicGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep ink background -->
  <rect width="800" height="600" fill="url(#spiderBg)" />

  <!-- Ben-Day Halftone Overlay -->
  <rect width="800" height="600" fill="url(#halftone)" />

  <!-- Kinetic Speed Lines & Angled Comic Panels -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="0" x2="40" y2="600" stroke-dasharray="12,8" />
    <line x1="250" y1="0" x2="190" y2="600" stroke-dasharray="16,10" />
    <line x1="700" y1="0" x2="760" y2="600" stroke-dasharray="14,8" />
    <line x1="550" y1="0" x2="610" y2="600" stroke-dasharray="12,12" />
  </g>

  <!-- Neon Skyscraper Silhouettes (Inverted Leap of Faith Perspective) -->
  <g fill="#09090b" stroke="#f43f5e" stroke-width="2" opacity="0.85">
    <!-- Left tower -->
    <polygon points="40,600 40,240 180,180 180,600" />
    <!-- Center distant towers -->
    <polygon points="220,600 220,320 340,300 340,600" fill="#030712" stroke="#06b6d4" stroke-width="1.5" />
    <polygon points="460,600 460,300 580,320 580,600" fill="#030712" stroke="#fbbf24" stroke-width="1.5" />
    <!-- Right tower -->
    <polygon points="620,600 620,180 760,240 760,600" />
  </g>

  <!-- Glowing Skyscraper Windows (Pop Yellow & Cyan) -->
  <g fill="#fde047" opacity="0.6">
    <rect x="70" y="260" width="8" height="14" />
    <rect x="90" y="260" width="8" height="14" />
    <rect x="110" y="260" width="8" height="14" />
    <rect x="70" y="300" width="8" height="14" />
    <rect x="90" y="300" width="8" height="14" fill="#38bdf8" />
    <rect x="110" y="300" width="8" height="14" />
    <rect x="70" y="340" width="8" height="14" />
    <rect x="90" y="340" width="8" height="14" />
    <rect x="110" y="340" width="8" height="14" fill="#fb7185" />

    <rect x="650" y="260" width="8" height="14" />
    <rect x="670" y="260" width="8" height="14" fill="#38bdf8" />
    <rect x="690" y="260" width="8" height="14" />
    <rect x="650" y="300" width="8" height="14" />
    <rect x="670" y="300" width="8" height="14" />
    <rect x="690" y="300" width="8" height="14" fill="#fb7185" />
  </g>

  <!-- Spray Paint Splatter Circles -->
  <circle cx="390" cy="240" r="160" fill="#e11d48" opacity="0.25" filter="url(#comicGlow)" />
  <circle cx="410" cy="230" r="120" fill="#06b6d4" opacity="0.2" filter="url(#comicGlow)" />

  <!-- Miles Morales Inverted Leap of Faith (Falling Upwards Silhouette) -->
  <g transform="translate(400, 240) rotate(15)">
    <!-- Cyan Glitch Shadow -->
    <g transform="translate(-6, -4)" opacity="0.8">
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="#06b6d4" />
      <circle cx="0" cy="-45" r="18" fill="#06b6d4" />
      <line x1="-20" y1="-10" x2="-65" y2="-40" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" />
      <line x1="20" y1="-10" x2="65" y2="-40" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" />
      <line x1="-14" y1="35" x2="-45" y2="90" stroke="#06b6d4" stroke-width="15" stroke-linecap="round" />
      <line x1="14" y1="35" x2="45" y2="85" stroke="#06b6d4" stroke-width="15" stroke-linecap="round" />
    </g>

    <!-- Magenta Glitch Shadow -->
    <g transform="translate(6, 4)" opacity="0.8">
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="#e11d48" />
      <circle cx="0" cy="-45" r="18" fill="#e11d48" />
      <line x1="-20" y1="-10" x2="-65" y2="-40" stroke="#e11d48" stroke-width="14" stroke-linecap="round" />
      <line x1="20" y1="-10" x2="65" y2="-40" stroke="#e11d48" stroke-width="14" stroke-linecap="round" />
      <line x1="-14" y1="35" x2="-45" y2="90" stroke="#e11d48" stroke-width="15" stroke-linecap="round" />
      <line x1="14" y1="35" x2="45" y2="85" stroke="#e11d48" stroke-width="15" stroke-linecap="round" />
    </g>

    <!-- Black Master Ink Silhouette -->
    <g fill="#020617" stroke="#ffffff" stroke-width="2">
      <!-- Torso with red hoodie vibe -->
      <ellipse cx="0" cy="0" rx="28" ry="38" fill="#09090b" stroke="#ffffff" stroke-width="2.5" />
      <!-- Red spray logo badge -->
      <path d="M -8 -8 L 0 -16 L 8 -8 L 0 6 Z" fill="#e11d48" />
      <!-- Head / Mask -->
      <circle cx="0" cy="-45" r="18" fill="#09090b" stroke="#ffffff" stroke-width="2" />
      <!-- Big white spider mask eyes -->
      <polygon points="-12,-50 -4,-54 -2,-42 -10,-42" fill="#ffffff" />
      <polygon points="12,-50 4,-54 2,-42 10,-42" fill="#ffffff" />
      <!-- Left arm outstretched -->
      <line x1="-20" y1="-10" x2="-65" y2="-40" stroke="#09090b" stroke-width="14" stroke-linecap="round" />
      <!-- Right arm outstretched with web shoot -->
      <line x1="20" y1="-10" x2="65" y2="-40" stroke="#09090b" stroke-width="14" stroke-linecap="round" />
      <!-- Floating sneaker legs -->
      <line x1="-14" y1="35" x2="-45" y2="90" stroke="#09090b" stroke-width="15" stroke-linecap="round" />
      <line x1="14" y1="35" x2="45" y2="85" stroke="#09090b" stroke-width="15" stroke-linecap="round" />
      <!-- Red Jordan 1 sneakers accents -->
      <circle cx="-50" cy="95" r="8" fill="#e11d48" />
      <circle cx="50" cy="90" r="8" fill="#e11d48" />
    </g>
  </g>

  <!-- Kinetic comic burst stars -->
  <polygon points="340,110 345,125 360,128 348,138 352,154 340,144 328,154 332,138 320,128 335,125" fill="#fde047" opacity="0.9" />
  <polygon points="480,130 484,142 496,145 486,152 489,165 480,157 471,165 474,152 464,145 476,142" fill="#38bdf8" opacity="0.9" />
</svg>

