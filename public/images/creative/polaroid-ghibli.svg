<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Soft Ghibli twilight gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#bae6fd" />
      <stop offset="65%" stop-color="#fed7aa" />
      <stop offset="85%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Shallow sea reflection gradient -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Warm sunset glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="380" fill="url(#skyGrad)" />

  <!-- Distant Fluffy Ghibli Clouds -->
  <g opacity="0.95">
    <!-- Huge main cloud with watercolor layers -->
    <ellipse cx="620" cy="220" rx="140" ry="90" fill="#ffffff" opacity="0.9" />
    <ellipse cx="540" cy="240" rx="90" ry="70" fill="#ffffff" opacity="0.95" />
    <ellipse cx="710" cy="250" rx="90" ry="60" fill="#ffffff" opacity="0.9" />
    <!-- Cloud sunset rim highlight -->
    <ellipse cx="620" cy="260" rx="150" ry="50" fill="#fed7aa" opacity="0.5" />
    <ellipse cx="600" cy="275" rx="130" ry="35" fill="#fbcfe8" opacity="0.4" />

    <!-- Left smaller background cloud -->
    <ellipse cx="180" cy="280" rx="90" ry="45" fill="#ffffff" opacity="0.75" />
    <ellipse cx="230" cy="290" rx="60" ry="35" fill="#ffffff" opacity="0.8" />
    <ellipse cx="180" cy="305" rx="80" ry="25" fill="#fed7aa" opacity="0.4" />
  </g>

  <!-- Golden Sunset Sun behind horizon -->
  <circle cx="400" cy="370" r="45" fill="#fef08a" opacity="0.85" filter="url(#glow)" />

  <!-- Shallow Calm Sea -->
  <rect y="380" width="800" height="220" fill="url(#seaGrad)" />

  <!-- Sun reflection on water -->
  <ellipse cx="400" cy="400" rx="55" ry="6" fill="#fef08a" opacity="0.6" />
  <ellipse cx="400" cy="420" rx="80" ry="8" fill="#fde047" opacity="0.4" />
  <ellipse cx="400" cy="450" rx="110" ry="10" fill="#fef08a" opacity="0.25" />
  <ellipse cx="400" cy="490" rx="140" ry="12" fill="#fed7aa" opacity="0.2" />

  <!-- Water ripple highlights -->
  <line x1="80" y1="410" x2="220" y2="410" stroke="#7dd3fc" stroke-width="2" opacity="0.4" stroke-linecap="round" />
  <line x1="580" y1="420" x2="720" y2="420" stroke="#7dd3fc" stroke-width="2" opacity="0.4" stroke-linecap="round" />
  <line x1="140" y1="460" x2="320" y2="460" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <line x1="480" y1="480" x2="680" y2="480" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" stroke-linecap="round" />
  <line x1="220" y1="530" x2="540" y2="530" stroke="#bae6fd" stroke-width="2" opacity="0.3" stroke-linecap="round" />

  <!-- Floating Electric Train Poles submerged in shallow water (Spirited Away motif) -->
  <g stroke="#334155" stroke-linecap="round">
    <!-- Pole 1 (Distant Left) -->
    <line x1="120" y1="310" x2="120" y2="395" stroke-width="3" />
    <line x1="108" y1="325" x2="132" y2="325" stroke-width="2" />
    <circle cx="108" cy="325" r="2.5" fill="#f8fafc" />
    <circle cx="132" cy="325" r="2.5" fill="#f8fafc" />
    <!-- Water wake around pole 1 -->
    <ellipse cx="120" cy="395" rx="14" ry="3" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.7" />

    <!-- Pole 2 (Mid-distance Center-Left) -->
    <line x1="260" y1="270" x2="260" y2="405" stroke-width="3.5" />
    <line x1="244" y1="290" x2="276" y2="290" stroke-width="2.5" />
    <circle cx="244" cy="290" r="3" fill="#f8fafc" />
    <circle cx="276" cy="290" r="3" fill="#f8fafc" />
    <ellipse cx="260" cy="405" rx="18" ry="4" fill="none" stroke="#bae6fd" stroke-width="1.5" opacity="0.7" />

    <!-- Connecting wire -->
    <path d="M 120 325 Q 190 345 260 290" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Train Tracks submerged in water -->
  <line x1="0" y1="410" x2="800" y2="410" stroke="#94a3b8" stroke-width="2.5" opacity="0.6" />
  <line x1="0" y1="422" x2="800" y2="422" stroke="#64748b" stroke-width="3" opacity="0.7" />

  <!-- The Iconic Sea Train (Spirited Away red/orange vintage passenger car) -->
  <g transform="translate(360, 310)">
    <!-- Water reflection of train -->
    <rect x="0" y="112" width="280" height="45" fill="#b45309" opacity="0.25" filter="url(#glow)" />

    <!-- Train Body -->
    <rect x="0" y="0" width="280" height="108" rx="12" fill="#c2410c" stroke="#7c2d12" stroke-width="3" />
    <!-- Roof with vintage curve -->
    <rect x="-6" y="-6" width="292" height="18" rx="8" fill="#78350f" />
    <!-- Yellow warning stripe -->
    <rect x="0" y="74" width="280" height="12" fill="#facc15" opacity="0.9" />

    <!-- Glowing train windows -->
    <g fill="#fef08a" stroke="#78350f" stroke-width="2">
      <!-- Window 1 with passenger silhouette -->
      <rect x="24" y="22" width="46" height="42" rx="4" />
      <circle cx="47" cy="44" r="10" fill="#334155" opacity="0.8" />
      <!-- Window 2 (Warm interior) -->
      <rect x="88" y="22" width="46" height="42" rx="4" />
      <!-- Window 3 with Chihiro silhouette & No Face silhouette -->
      <rect x="152" y="22" width="46" height="42" rx="4" />
      <path d="M 166 54 C 166 40 178 40 178 54 Z" fill="#1e293b" />
      <path d="M 184 54 C 184 32 196 32 196 54 Z" fill="#09090b" />
      <!-- Window 4 -->
      <rect x="216" y="22" width="46" height="42" rx="4" />
    </g>

    <!-- Wheels & Track splash -->
    <circle cx="45" cy="108" r="12" fill="#334155" />
    <circle cx="85" cy="108" r="12" fill="#334155" />
    <circle cx="195" cy="108" r="12" fill="#334155" />
    <circle cx="235" cy="108" r="12" fill="#334155" />
    <!-- Small gentle water wakes around wheels -->
    <ellipse cx="65" cy="115" rx="35" ry="5" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.8" />
    <ellipse cx="215" cy="115" rx="35" ry="5" fill="none" stroke="#f8fafc" stroke-width="2" opacity="0.8" />
  </g>
</svg>

