<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="hallwayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#hallwayBg)" />

  <!-- Kubrickian One-Point Perspective Hallway Geometry -->
  <g stroke="#f59e0b" opacity="0.8">
    <!-- Outer framing border 2.39:1 CinemaScope -->
    <rect x="100" y="160" width="1000" height="480" fill="none" stroke="#e7e5e4" stroke-width="2" />

    <!-- Vanishing Point in absolute center -->
    <circle cx="600" cy="400" r="5" fill="#f59e0b" />

    <!-- Perspective convergence lines to center -->
    <line x1="100" y1="160" x2="600" y2="400" stroke-width="1.5" />
    <line x1="1100" y1="160" x2="600" y2="400" stroke-width="1.5" />
    <line x1="100" y1="640" x2="600" y2="400" stroke-width="1.5" />
    <line x1="1100" y1="640" x2="600" y2="400" stroke-width="1.5" />

    <!-- Rule of Thirds Grid -->
    <line x1="433" y1="160" x2="433" y2="640" stroke="#78716c" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="766" y1="160" x2="766" y2="640" stroke="#78716c" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="100" y1="320" x2="1100" y2="320" stroke="#78716c" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="100" y1="480" x2="1100" y2="480" stroke="#78716c" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

    <!-- Nested Interior Hallway Receding Portals -->
    <rect x="250" y="240" width="700" height="320" fill="none" stroke="#d97706" stroke-width="1.2" />
    <rect x="400" y="310" width="400" height="180" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="520" y="365" width="160" height="70" fill="#292524" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="80" y="80" font-family="monospace" font-size="13" fill="#f59e0b" letter-spacing="3">CINEMATOGRAPHY ESSAY · 03</text>
  <text x="80" y="120" font-family="sans-serif" font-weight="900" font-size="40" fill="#fafaf9" letter-spacing="-1">THE GEOMETRY OF A FILM FRAME</text>

  <!-- Framing Metadata -->
  <text x="100" y="680" font-family="monospace" font-size="12" fill="#a8a29e">ASPECT RATIO: 2.39:1 ANAMORPHIC · ONE-POINT PERSPECTIVE · GOLDEN RATIO EYE CONVERGENCE</text>
  <text x="1050" y="680" font-family="monospace" font-size="12" fill="#f59e0b">ASHISH YADAV</text>
</svg>

