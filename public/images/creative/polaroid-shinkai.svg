<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Shinkai Kataware-doki Twilight Gradient (Ultraviolet to Solar Gold) -->
    <linearGradient id="shinkaiSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="30%" stop-color="#312e81" />
      <stop offset="55%" stop-color="#831843" />
      <stop offset="75%" stop-color="#c2410c" />
      <stop offset="90%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Comet trail glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="480" fill="url(#shinkaiSky)" />

  <!-- Distant Twinkling Stars in upper violet atmosphere -->
  <g fill="#ffffff">
    <circle cx="120" cy="50" r="1.5" opacity="0.8" />
    <circle cx="280" cy="40" r="2" opacity="0.9" />
    <circle cx="450" cy="70" r="1.2" opacity="0.7" />
    <circle cx="620" cy="45" r="1.8" opacity="0.85" />
    <circle cx="710" cy="80" r="1.2" opacity="0.6" />
    <circle cx="190" cy="110" r="1" opacity="0.5" />
    <circle cx="560" cy="110" r="1.5" opacity="0.75" />
  </g>

  <!-- The Iconic Tiamat Comet Splitting into Two (Your Name motif) -->
  <g transform="translate(480, 60) rotate(-35)" filter="url(#starGlow)">
    <!-- Primary Comet Tail -->
    <path d="M 0 0 C 80 -15, 220 -20, 360 -15" fill="none" stroke="#67e8f9" stroke-width="4" opacity="0.9" />
    <path d="M 0 0 C 80 -15, 220 -20, 360 -15" fill="none" stroke="#ffffff" stroke-width="2" opacity="1" />
    <!-- Secondary Splinter Comet Tail (Pink/Rose) -->
    <path d="M 40 8 C 110 0, 240 -5, 340 0" fill="none" stroke="#f472b6" stroke-width="3" opacity="0.8" />
    <!-- Comet Core Nucleus Head -->
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
    <circle cx="0" cy="0" r="10" fill="#67e8f9" opacity="0.5" />
  </g>

  <!-- High-Altitude Feathered Cirrus Clouds Catching Sunset Gold -->
  <g opacity="0.75">
    <path d="M 80 180 Q 220 150 400 170 Q 560 190 720 160" fill="none" stroke="#fbcfe8" stroke-width="12" stroke-linecap="round" opacity="0.4" />
    <path d="M 140 220 Q 320 190 520 210 Q 640 220 760 190" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linecap="round" opacity="0.5" />
    <path d="M 40 260 Q 240 230 460 250 Q 600 260 740 230" fill="none" stroke="#fde047" stroke-width="20" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Tokyo City Skyline Silhouette in Deep Purple Ink -->
  <g fill="#0f0e17">
    <!-- Base city horizon -->
    <rect y="440" width="800" height="160" />

    <!-- Skyscraper towers -->
    <rect x="60" y="360" width="55" height="120" />
    <rect x="130" y="330" width="45" height="150" />
    <polygon points="152,300 148,330 156,330" /> <!-- Tower spire -->

    <rect x="200" y="380" width="70" height="100" />
    <rect x="290" y="340" width="50" height="140" />

    <!-- Tokyo Tower lattice silhouette -->
    <polygon points="380,240 372,440 388,440" stroke="#0f0e17" stroke-width="2" />
    <line x1="365" y1="360" x2="395" y2="360" stroke="#0f0e17" stroke-width="3" />
    <line x1="370" y1="310" x2="390" y2="310" stroke="#0f0e17" stroke-width="2.5" />
    <circle cx="380" cy="235" r="3" fill="#ef4444" /> <!-- Red warning beacon -->

    <!-- Shinjuku towers cluster -->
    <rect x="420" y="350" width="60" height="130" />
    <rect x="500" y="320" width="55" height="160" />
    <rect x="580" y="360" width="75" height="120" />
    <rect x="680" y="380" width="50" height="100" />
  </g>

  <!-- Distant Glowing Train & City Window Lights -->
  <g fill="#fef08a" opacity="0.8">
    <circle cx="145" cy="350" r="1.5" />
    <circle cx="155" cy="370" r="1.5" />
    <circle cx="145" cy="390" r="1.5" />
    <circle cx="440" cy="370" r="1.5" />
    <circle cx="450" cy="390" r="1.5" />
    <circle cx="520" cy="340" r="1.5" />
    <circle cx="530" cy="360" r="1.5" />
    <!-- Distant commuter train line on viaduct with glowing windows -->
    <rect x="220" y="445" width="180" height="6" fill="#fde047" opacity="0.9" rx="2" />
  </g>

  <!-- Foreground Railway Crossing & Power Lines (Iconic Shinkai visual trope) -->
  <g stroke="#09080e" stroke-width="1.5" opacity="0.85">
    <!-- Utility pole left -->
    <line x1="80" y1="280" x2="80" y2="520" stroke-width="5" />
    <line x1="60" y1="310" x2="100" y2="310" stroke-width="3" />
    <line x1="55" y1="340" x2="105" y2="340" stroke-width="3" />
    <!-- Electric wires cutting gracefully across the twilight sky -->
    <path d="M 80 310 Q 300 360 800 320" fill="none" stroke-width="1.5" />
    <path d="M 80 340 Q 350 400 800 350" fill="none" stroke-width="1.5" />
    <path d="M 0 330 Q 80 340 380 410" fill="none" stroke-width="1.2" />
  </g>
</svg>

