<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <pattern id="halftone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2.5" fill="#e11d48" opacity="0.4" />
    </pattern>
    <pattern id="dotsCyan" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="2" fill="#06b6d4" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#spiderBg)" />
  <rect width="1200" height="800" fill="url(#halftone)" opacity="0.5" />

  <!-- Offset Comic Panel Geometry -->
  <g transform="translate(100, 220)">
    <!-- Red offset frame -->
    <polygon points="40,20 480,-10 450,320 20,340" fill="none" stroke="#e11d48" stroke-width="3" opacity="0.8" />
    <!-- Cyan offset frame -->
    <polygon points="50,10 490,-20 460,310 30,330" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.8" />
    <!-- White key frame -->
    <polygon points="45,15 485,-15 455,315 25,335" fill="#0f172a" fill-opacity="0.85" stroke="#f8fafc" stroke-width="2" />

    <!-- Comic Ben-Day Dots inside panel -->
    <rect x="60" y="30" width="380" height="260" fill="url(#dotsCyan)" opacity="0.4" />

    <!-- Speed lines & Glitch markers -->
    <line x1="80" y1="80" x2="420" y2="80" stroke="#f43f5e" stroke-width="3" stroke-dasharray="12,6" />
    <line x1="100" y1="140" x2="400" y2="140" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4" />
    <line x1="70" y1="200" x2="430" y2="200" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="16,8" />

    <text x="90" y="260" font-family="monospace" font-size="14" fill="#f8fafc" letter-spacing="3">12 FPS ON ONES · 24 FPS ON TWOS</text>
  </g>

  <!-- Typography -->
  <text x="80" y="100" font-family="monospace" font-size="13" fill="#fb7185" letter-spacing="2">ANIMATION &amp; FILM STUDY · 01</text>
  <text x="80" y="145" font-family="sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">INTO THE SPIDER-VERSE</text>
  <text x="80" y="180" font-family="sans-serif" font-weight="500" font-size="18" fill="#94a3b8">The Engineering of Variable Frame Rates &amp; Comic Book Halftones</text>

  <!-- Technical Telemetry Footer -->
  <text x="80" y="740" font-family="monospace" font-size="12" fill="#64748b">TECHNIQUE: ANAMORPHIC HALFTONE · TIME-STEP ANIMATION · SONY PICTURES IMAGEWORKS</text>
  <text x="1050" y="740" font-family="monospace" font-size="12" fill="#e11d48">ASHISH YADAV</text>
</svg>

